# ============================================================
# Configuration du academic-service (Spring Boot 3.3.4 / Java 21, MVC servlet).
# Service académique : formations, emplois du temps, affectation des formateurs.
# Port interne 8085 ; base PostgreSQL "academic" ; bus Kafka kafka:19092.
# Les noms d'hôte (postgres, kafka, opa, identity-service) sont ceux du réseau Docker.
# ============================================================

server:
  port: 8085

spring:
  application:
    name: academic-service

  # --- Import optionnel de la configuration centralisée (Spring Cloud Config) ---
  # "optional:" : le service démarre même si le Config Server est absent (dev local).
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://config-server:8888}"

  # --- Source de données : base "academic" sur PostgreSQL ---
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/academic}
    username: ${POSTGRES_USER:unchk}
    password: ${POSTGRES_PASSWORD:unchk_dev_pwd}
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate : le schéma est géré par Flyway, Hibernate ne fait que valider ---
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # --- Flyway : migrations de schéma depuis db/migration ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # --- Kafka : sérialisation JSON, bootstrap interne, pas d'auto-création de topics ---
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:19092}
    consumer:
      group-id: academic-service
      auto-offset-reset: earliest

# --- Sécurité : validation des JWT RS256 via le JWKS d'identity-service ---
# Propriétés lues par la librairie commune (ConfigurationServeurRessources).
unchk:
  security:
    jwt:
      jwks-uri: ${JWT_JWKS_URI:http://identity-service:8080/.well-known/jwks.json}
      issuer: ${JWT_ISSUER_URI:http://identity-service:8080}
      audience: ${JWT_AUDIENCE:unchk-office}
  # --- Autorisation externalisée OPA (ABAC objet anti-IDOR côté service) ---
  authz:
    opa:
      url: ${OPA_URL:http://opa:8181}
      chemin: /v1/data/unchk/authz/allow_objet
      timeout: ${OPA_TIMEOUT_MS:2000}

# --- Supervision (santé / info) exposée pour les sondes Docker ---
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

# --- Journalisation : niveau INFO, pas de fuite d'informations internes ---
logging:
  level:
    root: INFO
    sn.unchk.office: DEBUG
