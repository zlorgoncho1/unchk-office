# ============================================================
# Configuration du service Administration (admin-service).
# Périmètre : gestion budgétaire (projet de budget, note d'orientation, budget réalisé),
# courrier arrivé/départ, notes de service & circulaires. Topic produit : admin.budget.
#
# Communication 100% Kafka (KRaft, kafka:19092) ; AUCUN appel REST inter-service.
# Base PostgreSQL dédiée « admin ». Anti-IDOR via OPA au niveau objet (libs/common).
# ============================================================

server:
  # Port applicatif du service (8087 selon l'architecture cible). Dans le réseau Docker,
  # le gateway route /api/admin/** ; SERVER_PORT permet de réaligner si besoin.
  port: ${SERVER_PORT:8087}

spring:
  application:
    name: admin-service

  # --- Configuration centralisée (Spring Cloud Config) : OPTIONNELLE ---
  # Le service démarre même sans config-server (import optionnel).
  config:
    import: ${CONFIG_IMPORT:optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}}

  # --- Source de données : base PostgreSQL « admin » ---
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/admin}
    username: ${DB_USER:${POSTGRES_USER:unchk}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:unchk_dev_pwd}}
    driver-class-name: org.postgresql.Driver

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      # Le schéma est géré par Flyway ; Hibernate se contente de valider la concordance.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false

  # --- Flyway : migrations versionnées depuis le DDL des docs ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --- Kafka (KRaft, listener interne du réseau Docker) ---
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_INTERNAL:kafka:19092}
    consumer:
      # Groupe de consommation propre au service (alimente les read-models locaux).
      group-id: ${KAFKA_GROUP_ID:admin-service}

# --- Sécurité : validation des JWT RS256 via JWKS d'identity-service ---
# Propriétés lues par libs/common (sn.unchk.office.common.security.JwtProprietes).
unchk:
  security:
    jwt:
      jwks-uri: ${JWT_JWKS_URI:http://identity-service:8080/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:unchk-office}
      audience: ${JWT_AUDIENCE:unchk-office}
  # --- Autorisation OPA (PDP Rego) : ABAC anti-IDOR au niveau objet ---
  authz:
    opa:
      url: ${OPA_URL:http://opa:8181}
      chemin: ${OPA_CHEMIN:/v1/data/unchk/authz/allow}
      timeout: ${OPA_TIMEOUT_MS:2000}

# --- Supervision (santé / info) exposée pour les sondes Docker ---
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

# --- Journalisation : niveau INFO, pas de fuite d'informations internes ---
logging:
  level:
    root: INFO
    sn.unchk.office: INFO
