# ============================================================
# document-service — gestion documentaire (port 8083, base "document")
# Communication inter-services : 100% Kafka. Binaire dans MinIO.
# ============================================================
server:
  port: 8083

spring:
  application:
    name: document-service

  # --- Import optionnel de la configuration centralisée (Spring Cloud Config) ---
  # optional: ... => le service démarre même si le config-server est absent (dev/CI).
  config:
    import: "optional:configserver:${CONFIG_SERVER_URI:http://config-server:8888}"

  # --- Base PostgreSQL dédiée "document" ---
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:document}
    username: ${DB_USER:unchk}
    password: ${DB_PASSWORD:unchk_dev_pwd}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Le schéma est géré par Flyway : Hibernate se contente de valider la concordance.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false

  # --- Migrations Flyway (DDL versionné) ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # --- Kafka (KRaft, bus inter-services) ---
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:19092}
    consumer:
      # Groupe propre au service : chaque service maintient ses read-models.
      group-id: document-service
      auto-offset-reset: earliest

  # --- Limite de taille des requêtes multipart (défense en profondeur) ---
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

# --- Sécurité : validation des JWT RS256 via le JWKS d'identity-service ---
unchk:
  security:
    jwt:
      jwks-uri: ${JWT_JWKS_URI:http://identity-service:8080/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:unchk-office}
      audience: ${JWT_AUDIENCE:unchk-office}
  # --- Autorisation OPA (ABAC objet, anti-IDOR) ---
  authz:
    opa:
      url: ${OPA_URL:http://opa:8181}
      chemin: /v1/data/unchk/authz/allow
      timeout: 2000

# --- Configuration MinIO (stockage objet) ---
document:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ROOT_USER:unchk}
    secret-key: ${MINIO_ROOT_PASSWORD:unchk_dev_pwd}
    # Bucket par défaut pour les documents génériques.
    bucket-defaut: documents
    # Bucket dédié au courrier (arrivé/départ).
    bucket-courriers: courriers
    # Durée de validité (en secondes) des URLs présignées de téléchargement.
    presigned-ttl-secondes: 300
  # --- Relais Outbox -> Kafka ---
  outbox:
    # Intervalle (ms) entre deux passages du relais de publication.
    intervalle-ms: 2000
  # --- Garde-fous d'upload (anti-abus / OWASP) ---
  upload:
    # Taille maximale d'un fichier (octets) : 25 Mo par défaut.
    taille-max-octets: 26214400
    # Types MIME autorisés (allow-list) pour les documents/courriers.
    types-mime-autorises:
      - application/pdf
      - image/png
      - image/jpeg
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - application/vnd.ms-excel
      - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      - text/plain

# --- Actuator : exposition minimale (santé) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
