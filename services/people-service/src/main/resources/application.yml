# ============================================================
# people-service — entites canoniques Etudiant et Personnel/Formateur.
# Port 8082 (host) ; ecoute interne 8080 sur le reseau Docker unchk-net.
# Communication INTER-services = 100% Kafka. Aucun appel REST entre services.
# ============================================================

server:
  # Le gateway route /api/people/** vers people-service:8080 (reseau Docker).
  # En local hors Docker on expose 8082 (cf. tableau des ports docs/architecture.md).
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: people-service

  # --- Import optionnel de la configuration centralisee (Spring Cloud Config) ---
  config:
    import: ${CONFIG_IMPORT:optional:configserver:http://config-server:8888}

  # --- Datasource PostgreSQL : base "people" ---
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/people}
    username: ${DB_USER:${POSTGRES_USER:unchk}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:unchk_dev_pwd}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Le schema est gere par Flyway : Hibernate ne fait que valider la concordance.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    open-in-view: false

  # --- Migrations de schema Flyway (V1__init.sql) ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  # --- Kafka : bootstrap interne, serialisation JSON, pas d'auto-create de topics ---
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:kafka:19092}
    consumer:
      # Groupe propre au service : ses read-models locaux (projections CQRS).
      group-id: ${KAFKA_GROUP_ID:people-service}
      auto-offset-reset: earliest

  # --- Securite : validation des JWT RS256 via le JWKS d'identity-service ---
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWT_JWKS_URI:http://identity-service:8080/.well-known/jwks.json}

# --- Proprietes du serveur de ressources (libs/common) ---
unchk:
  security:
    jwt:
      jwks-uri: ${JWT_JWKS_URI:http://identity-service:8080/.well-known/jwks.json}
      issuer: ${JWT_ISSUER:unchk-office}
      audience: ${JWT_AUDIENCE:unchk-office}
  # --- Autorisation OPA (libs/common) : ABAC anti-IDOR au niveau objet ---
  authz:
    opa:
      url: ${OPA_URL:http://opa:8181}
      chemin: /v1/data/unchk/authz/allow
      timeout: ${OPA_TIMEOUT_MS:2000}

# --- Supervision : sondes de sante exposees pour Docker ---
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

# --- Journalisation : INFO par defaut, pas de fuite d'informations internes ---
logging:
  level:
    root: INFO
    sn.unchk.office: INFO
