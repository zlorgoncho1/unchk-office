# ============================================================
# Configuration de TEST du people-service.
# Valeurs factices : aucun acces reseau reel (PostgreSQL, Kafka, OPA, JWKS) en test unitaire.
# ============================================================

spring:
  # On evite tout import de config server distant pendant les tests.
  config:
    import: ""
  # La datasource n'est pas sollicitee par les tranches MVC / unitaires (services mockes).
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  kafka:
    bootstrap-servers: localhost:59092

# Proprietes du serveur de ressources (valeurs factices, non contactees en test).
unchk:
  security:
    jwt:
      jwks-uri: http://localhost:0/.well-known/jwks.json
      issuer: unchk-office-test
      audience: unchk-office-test
  authz:
    opa:
      url: http://localhost:0
      chemin: /v1/data/unchk/authz/allow
      timeout: 1000

logging:
  level:
    root: WARN
    sn.unchk.office: INFO
