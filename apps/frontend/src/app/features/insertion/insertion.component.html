<!-- Suivi des stages d'insertion : tableau brandé filtrable + gestion (CRUD). -->
<unchk-page-header
  titre="Suivi insertion"
  sousTitre="Suivi des stages des étudiants"
  icone="case-round-bold-duotone"
>
  <button mat-flat-button color="primary" (click)="nouveau()">
    <iconify-icon icon="solar:add-circle-bold"></iconify-icon>
    <span>&nbsp;Nouveau stage</span>
  </button>
</unchk-page-header>

@if (data.etat().erreur) {
  <unchk-empty-state
    icone="shield-warning-line-duotone"
    titre="Indisponible"
    [message]="data.etat().erreur"
  />
} @else {
  <unchk-section-card sansBordure>
    <unchk-data-table
      detaillable
      [colonnes]="colonnes"
      [lignes]="lignes()"
      [chargement]="data.etat().chargement"
      modifiable
      supprimable
      (modifier)="onModifier($event)"
      (supprimer)="onSupprimer($event)"
      filtrable
      placeholderFiltre="Filtrer par intitulé, maître de stage, statut…"
      titreVide="Aucun stage"
      messageVide="Aucun stage enregistré pour le moment."
      iconeVide="case-round-line-duotone"
    />
  </unchk-section-card>
}
