<!-- Page Budgets : compteurs + tableau brandé. -->
<unchk-page-header
  titre="Budgets"
  sousTitre="Suivi budgétaire de l'université : prévu, réalisé et taux d'exécution"
  icone="wallet-money-bold-duotone"
>
  <button mat-flat-button color="primary" (click)="nouveau()">
    <iconify-icon icon="solar:add-circle-bold"></iconify-icon>
    <span>&nbsp;Nouveau budget</span>
  </button>
</unchk-page-header>

@if (data.etat().erreur) {
  <!-- Erreur de chargement : état vide dédié. -->
  <unchk-empty-state
    icone="shield-warning-line-duotone"
    titre="Budgets indisponibles"
    [message]="data.etat().erreur"
  />
} @else {
  <!-- Compteurs synthétiques (masqués tant qu'il n'y a aucune donnée). -->
  @if (nbBudgets() > 0) {
    <section class="budgets__kpis">
      <unchk-stat-card
        libelle="Budgets suivis"
        [valeur]="nbBudgets()"
        icone="wallet-money-bold-duotone"
        ton="blue"
      />
      <unchk-stat-card
        libelle="Total prévu"
        [valeur]="exposeMontant(totalPrevu())"
        icone="banknote-2-bold-duotone"
        ton="orange"
      />
      <unchk-stat-card
        libelle="Total réalisé"
        [valeur]="exposeMontant(totalRealise())"
        icone="chart-2-bold-duotone"
        ton="green"
      />
    </section>
  }

  <!-- Tableau des budgets : filtrable. -->
  <unchk-section-card sansBordure>
    <unchk-data-table
      detaillable
      [colonnes]="colonnes"
      [lignes]="lignes()"
      [chargement]="data.etat().chargement"
      modifiable
      supprimable
      (modifier)="onModifier($event)"
      (supprimer)="onSupprimer($event)"
      filtrable
      placeholderFiltre="Filtrer par libellé, exercice, statut…"
      titreVide="Aucun budget"
      messageVide="Aucun budget n'est enregistré pour le moment."
      iconeVide="wallet-money-bold-duotone"
    />
  </unchk-section-card>
}
