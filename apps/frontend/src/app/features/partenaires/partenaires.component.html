<unchk-page-header
  titre="Partenaires"
  sousTitre="Réseau de partenaires de l'appui à l'insertion"
  icone="buildings-2-bold-duotone"
>
  <button mat-flat-button color="primary" (click)="nouveau()">
    <iconify-icon icon="solar:add-circle-bold"></iconify-icon>
    <span>&nbsp;Nouveau partenaire</span>
  </button>
</unchk-page-header>

@if (data.etat().erreur) {
  <unchk-empty-state
    icone="shield-warning-line-duotone"
    titre="Indisponible"
    [message]="data.etat().erreur"
  />
} @else {
  <unchk-section-card sansBordure>
    <unchk-data-table
      detaillable
      [colonnes]="colonnes"
      [lignes]="lignes()"
      [chargement]="data.etat().chargement"
      modifiable
      supprimable
      (modifier)="onModifier($event)"
      (supprimer)="onSupprimer($event)"
      filtrable
      titreVide="Aucun partenaire"
      messageVide="La base de partenaires est vide pour le moment."
      iconeVide="buildings-2-line-duotone"
    />
  </unchk-section-card>
}
