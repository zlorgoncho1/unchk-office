<!-- Page Formations : en-tête brandé + bouton Nouveau + tableau de données filtrable. -->
<unchk-page-header
  titre="Formations"
  sousTitre="Catalogue des formations et suivi des effectifs formés"
  icone="square-academic-cap-bold-duotone"
>
  <button mat-flat-button color="primary" (click)="nouveau()">
    <iconify-icon icon="solar:add-circle-bold"></iconify-icon>
    <span>&nbsp;Nouvelle formation</span>
  </button>
</unchk-page-header>

@if (data.etat().erreur) {
  <unchk-empty-state
    icone="shield-warning-line-duotone"
    titre="Indisponible"
    [message]="data.etat().erreur"
  />
} @else {
  <unchk-section-card sansBordure>
    <unchk-data-table
      detaillable
      [colonnes]="colonnes"
      [lignes]="lignes()"
      [chargement]="data.etat().chargement"
      modifiable
      supprimable
      (modifier)="onModifier($event)"
      (supprimer)="onSupprimer($event)"
      filtrable
      titreVide="Aucune formation"
      messageVide="Aucune formation n'est enregistrée pour le moment."
      iconeVide="square-academic-cap-line-duotone"
    />
  </unchk-section-card>
}
