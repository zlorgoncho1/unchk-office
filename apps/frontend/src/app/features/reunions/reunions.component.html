<!-- Page Réunions : en-tête + tableau brandé filtrable. -->
<unchk-page-header
  titre="Réunions"
  sousTitre="Réunions, séminaires et webinaires de l'université"
  icone="calendar-bold-duotone"
>
  <button mat-flat-button color="primary" (click)="nouveau()">
    <iconify-icon icon="solar:add-circle-bold"></iconify-icon>
    <span>&nbsp;Nouvelle réunion</span>
  </button>
</unchk-page-header>

@if (data.etat().erreur) {
  <unchk-empty-state
    icone="shield-warning-line-duotone"
    titre="Réunions indisponibles"
    [message]="data.etat().erreur"
  ></unchk-empty-state>
} @else {
  <unchk-section-card sansBordure>
    <unchk-data-table
        detaillable
      [colonnes]="colonnes"
      [lignes]="lignes()"
      [chargement]="data.etat().chargement"
      filtrable
      placeholderFiltre="Filtrer par titre, type, lieu, organisateur…"
      titreVide="Aucune réunion"
      messageVide="Aucune réunion n'est enregistrée pour le moment."
      iconeVide="calendar-mark-line-duotone"
    ></unchk-data-table>
  </unchk-section-card>
}
