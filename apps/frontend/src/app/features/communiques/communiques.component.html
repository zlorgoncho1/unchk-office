<!-- Page Communiqués : notes de service & circulaires du niveau central. -->
<unchk-page-header
  titre="Communiqués"
  sousTitre="Notes de service et circulaires : rédaction, ciblage et publication"
  icone="megaphone-bold-duotone"
>
  <button mat-flat-button color="primary" (click)="nouveau()">
    <iconify-icon icon="solar:add-circle-bold"></iconify-icon>
    <span>&nbsp;Nouveau communiqué</span>
  </button>
</unchk-page-header>

@if (data.etat().erreur) {
  <unchk-empty-state
    icone="shield-warning-line-duotone"
    titre="Communiqués indisponibles"
    [message]="data.etat().erreur"
  />
} @else {
  <!-- Compteurs synthétiques (masqués tant qu'il n'y a aucune donnée). -->
  @if (nbTotal() > 0) {
    <section class="communiques__kpis">
      <unchk-stat-card
        libelle="Communiqués"
        [valeur]="nbTotal()"
        icone="megaphone-bold-duotone"
        ton="blue"
      />
      <unchk-stat-card
        libelle="Circulaires"
        [valeur]="nbCirculaires()"
        icone="document-text-bold-duotone"
        ton="orange"
      />
      <unchk-stat-card
        libelle="Notes de service"
        [valeur]="nbNotes()"
        icone="notes-bold-duotone"
        ton="navy"
      />
      <unchk-stat-card
        libelle="Publiés"
        [valeur]="nbPublies()"
        icone="check-circle-bold-duotone"
        ton="green"
      />
    </section>
  }

  <unchk-section-card sansBordure>
    <unchk-data-table
      detaillable
      [colonnes]="colonnes"
      [lignes]="lignes()"
      [chargement]="data.etat().chargement"
      modifiable
      supprimable
      actionnable
      actionIcone="solar:plain-bold-duotone"
      actionInfobulle="Publier (notifier les destinataires)"
      [actionVisible]="publiable"
      (action)="onPublier($event)"
      (modifier)="onModifier($event)"
      (supprimer)="onSupprimer($event)"
      filtrable
      placeholderFiltre="Filtrer par titre, nature, audience…"
      titreVide="Aucun communiqué"
      messageVide="Aucune note de service ni circulaire pour le moment."
      iconeVide="megaphone-bold-duotone"
    />
  </unchk-section-card>
}
