<!-- Page Documents : liste documentaire dans le tableau brandé. -->
<unchk-page-header
  titre="Documents"
  sousTitre="Gestion documentaire : courriers, notes, circulaires et pièces archivées"
  icone="folder-with-files-bold-duotone"
>
  <button mat-flat-button color="primary" (click)="nouveau()">
    <iconify-icon icon="solar:add-circle-bold"></iconify-icon>
    <span>&nbsp;Nouveau document</span>
  </button>
</unchk-page-header>

@if (data.etat().erreur) {
  <unchk-empty-state
    icone="shield-warning-line-duotone"
    titre="Documents indisponibles"
    [message]="data.etat().erreur"
  />
} @else {
  <unchk-section-card
    sansBordure
    titre="Catalogue documentaire"
    icone="folder-with-files-line-duotone"
  >
    <!-- Filtre par catégorie : recharge la table sur la liste filtrée du backend. -->
    <mat-form-field actions appearance="outline" class="doc-filtre-categorie">
      <mat-label>Catégorie</mat-label>
      <mat-select
        [value]="categorieFiltre()"
        (selectionChange)="onFiltrerCategorie($event.value)"
      >
        <!-- Option « Toutes » : valeur vide -> aucun filtre côté API. -->
        <mat-option [value]="''">Toutes</mat-option>
        @for (c of categories; track c.valeur) {
          <mat-option [value]="c.valeur">{{ c.libelle }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <unchk-data-table
      detaillable
      [colonnes]="colonnes"
      [lignes]="lignes()"
      [chargement]="data.etat().chargement"
      modifiable
      supprimable
      (modifier)="onModifier($event)"
      (supprimer)="onSupprimer($event)"
      filtrable
      placeholderFiltre="Filtrer par titre, catégorie, type…"
      titreVide="Aucun document"
      messageVide="Aucun document n'est disponible pour le moment."
      iconeVide="folder-open-line-duotone"
    />
  </unchk-section-card>
}
