server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA Angular : toute route non-fichier retombe sur index.html (routing côté client).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les assets versionnés (hash dans le nom de fichier).
    location ~* \.(?:js|css|woff2?|ttf|png|jpe?g|svg|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
