# ============================================================
# Configuration spécifique : document-service
# Gestion documentaire (courriers, notes de service, circulaires...).
# Stockage des fichiers dans MinIO (S3).
# Topic Kafka publié : document.documents
# Base PostgreSQL : document
# ============================================================
server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/document

# Connexion au stockage objet MinIO (S3-compatible).
minio:
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ROOT_USER:unchk}
  secret-key: ${MINIO_ROOT_PASSWORD:unchk_dev_pwd}
  bucket: documents

# Topic Kafka émis par ce service (référence documentaire).
unchk:
  kafka:
    topics:
      documents: document.documents
