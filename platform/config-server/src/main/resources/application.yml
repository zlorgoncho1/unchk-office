# ============================================================
# Configuration du serveur de configuration lui-même.
# Port 8888 (port standard de Spring Cloud Config Server).
# Profil "native" : la configuration distribuée est lue depuis le
# classpath (dossier config/) au lieu d'un dépôt Git distant.
# ============================================================
server:
  port: 8888

spring:
  application:
    name: config-server
  # On active le profil "native" par défaut pour servir depuis le classpath.
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          # Emplacement des fichiers de configuration servis aux microservices.
          search-locations: classpath:/config

# Exposition minimale des endpoints de supervision (santé du serveur).
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true
