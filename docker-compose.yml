name: unchk-office

# Plan d'infrastructure. Les services applicatifs (gateway, identity, métier, frontend)
# sont ajoutés au fur et à mesure. Démarrage infra :
#   docker compose up -d kafka postgres minio opa kafka-ui

# ============================================================
# Bloc d'environnement partagé par les microservices métier.
# Harmonise des conventions de configuration divergentes entre services
# (DB, Kafka, OPA, JWT). Voir docs/journal-de-bord.md (#9).
# Tous les services écoutent en interne sur 8080 (cible du routage gateway).
# ============================================================
x-service-env: &service-env
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USER: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
  SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
  KAFKA_BOOTSTRAP: kafka:19092
  KAFKA_BOOTSTRAP_SERVERS: kafka:19092
  KAFKA_BOOTSTRAP_INTERNAL: kafka:19092
  OPA_URL: http://opa:8181
  JWT_ISSUER: http://identity-service:8080
  JWT_ISSUER_URI: http://identity-service:8080
  JWT_JWKS_URI: http://identity-service:8080/.well-known/jwks.json
  # Active uniformément le resource-server JWT de Spring Boot : certains services
  # n'avaient pas de chaîne JWT et retombaient sur la sécurité Basic par défaut.
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://identity-service:8080/.well-known/jwks.json
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://identity-service:8080
  CONFIG_SERVER_URI: http://config-server:8888
  CONFIG_SERVER_URL: http://config-server:8888
  CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
  SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server:8888"
  SERVER_PORT: "8080"
  # Flyway gère le schéma ; on désactive la validation Hibernate
  # (types PostgreSQL citext / enum / inet non reconnus par la validation).
  SPRING_JPA_HIBERNATE_DDL_AUTO: none
  # libs/common fournit un KafkaTemplate JSON qui doit primer sur l'auto-config Boot.
  SPRING_MAIN_ALLOW_BEAN_DEFINITION_OVERRIDING: "true"

x-service-depends: &service-depends
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:
  # ============================================================
  # Messaging : Apache Kafka en mode KRaft (cluster natif, SANS ZooKeeper)
  # Nœud unique combiné (broker + controller), extensible en cluster 3 nœuds.
  # ============================================================
  kafka:
    image: apache/kafka:3.8.1
    container_name: unchk-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://kafka:19092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [unchk-net]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: unchk-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: unchk
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      DYNAMIC_CONFIG_ENABLED: "true"
    networks: [unchk-net]

  # ============================================================
  # Base de données : PostgreSQL (une base par microservice)
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: unchk-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./platform/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [unchk-net]

  # ============================================================
  # Stockage objet : MinIO (S3) + initialisation des buckets
  # ============================================================
  minio:
    image: minio/minio:latest
    container_name: unchk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks: [unchk-net]

  minio-init:
    image: minio/mc:latest
    container_name: unchk-minio-init
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do
        echo 'attente de MinIO...'; sleep 2;
      done;
      mc mb -p local/logos local/documents local/courriers local/comptes-rendus local/avatars;
      mc anonymous set download local/logos;
      echo 'buckets MinIO prêts';
      "
    networks: [unchk-net]

  # ============================================================
  # Autorisation : OPA (Policy Decision Point)
  # ============================================================
  opa:
    image: openpolicyagent/opa:1.17.0
    container_name: unchk-opa
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "/policies"
    ports:
      - "8181:8181"
    volumes:
      - ./platform/opa/policies:/policies:ro
    networks: [unchk-net]

  # ============================================================
  # Config Server : configuration centralisée (Spring Cloud Config, profil natif)
  # Le contexte de build est la RACINE du dépôt (le Dockerfile copie le POM parent
  # puis le module platform/config-server pour compiler dans le conteneur Maven).
  # ============================================================
  config-server:
    build:
      context: .
      dockerfile: platform/config-server/Dockerfile
    container_name: unchk-config-server
    ports:
      - "8888:8888"
    networks: [unchk-net]

  # ============================================================
  # API Gateway : seul point d'entrée REST (Spring Cloud Gateway réactif / WebFlux)
  # Le contexte de build est la RACINE du dépôt (le Dockerfile copie le POM parent
  # puis le module apps/api-gateway pour compiler dans le conteneur Maven).
  # ============================================================
  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: unchk-api-gateway
    ports:
      - "8080:8080"
    environment:
      # URL du PDP OPA (autorisation RBAC au gateway).
      OPA_URL: http://opa:8181
    depends_on:
      kafka:
        condition: service_healthy
      opa:
        condition: service_started
    networks: [unchk-net]

  # ============================================================
  # Microservices métier (Spring Boot). Build : contexte racine + Dockerfile du module.
  # Tous écoutent en interne sur 8080 ; port hôte distinct pour le débogage.
  # ============================================================
  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: unchk-identity-service
    environment:
      <<: *service-env
      DB_NAME: identity
      # stringtype=unspecified : laisse PostgreSQL inférer le type des paramètres String
      # pour transtyper varchar -> enum role_code (la colonne 'role' de la clé composite
      # user_roles est un ENUM PG ; @ColumnTransformer est ignoré sur les @EmbeddedId).
      DB_URL: jdbc:postgresql://postgres:5432/identity?stringtype=unspecified
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/identity?stringtype=unspecified
    ports:
      - "8081:8080"
    depends_on: *service-depends
    networks: [unchk-net]

  people-service:
    build:
      context: .
      dockerfile: services/people-service/Dockerfile
    container_name: unchk-people-service
    environment:
      <<: *service-env
      DB_NAME: people
      DB_URL: jdbc:postgresql://postgres:5432/people
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/people
    ports:
      - "8082:8080"
    depends_on: *service-depends
    networks: [unchk-net]

  document-service:
    build:
      context: .
      dockerfile: services/document-service/Dockerfile
    container_name: unchk-document-service
    environment:
      <<: *service-env
      DB_NAME: document
      DB_URL: jdbc:postgresql://postgres:5432/document
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/document
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "8083:8080"
    depends_on:
      <<: *service-depends
      minio:
        condition: service_started
    networks: [unchk-net]

  communication-service:
    build:
      context: .
      dockerfile: services/communication-service/Dockerfile
    container_name: unchk-communication-service
    environment:
      <<: *service-env
      DB_NAME: communication
      DB_URL: jdbc:postgresql://postgres:5432/communication
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/communication
    ports:
      - "8084:8080"
    depends_on: *service-depends
    networks: [unchk-net]

  academic-service:
    build:
      context: .
      dockerfile: services/academic-service/Dockerfile
    container_name: unchk-academic-service
    environment:
      <<: *service-env
      DB_NAME: academic
      DB_URL: jdbc:postgresql://postgres:5432/academic
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/academic
    ports:
      - "8085:8080"
    depends_on: *service-depends
    networks: [unchk-net]

  insertion-service:
    build:
      context: .
      dockerfile: services/insertion-service/Dockerfile
    container_name: unchk-insertion-service
    environment:
      <<: *service-env
      DB_NAME: insertion
      DB_URL: jdbc:postgresql://postgres:5432/insertion
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/insertion
    ports:
      - "8086:8080"
    depends_on: *service-depends
    networks: [unchk-net]

  admin-service:
    build:
      context: .
      dockerfile: services/admin-service/Dockerfile
    container_name: unchk-admin-service
    environment:
      <<: *service-env
      DB_NAME: admin
      DB_URL: jdbc:postgresql://postgres:5432/admin
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/admin
    ports:
      - "8087:8080"
    depends_on: *service-depends
    networks: [unchk-net]

  # ============================================================
  # Frontend Angular (servi par nginx). Le navigateur appelle le gateway
  # sur http://localhost:8080 (origine http://localhost:4200, autorisée par le CORS).
  # ============================================================
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: unchk-frontend
    ports:
      - "4200:80"
    depends_on:
      - api-gateway
    networks: [unchk-net]

networks:
  unchk-net:
    driver: bridge

volumes:
  kafka-data:
  pg-data:
  minio-data:
